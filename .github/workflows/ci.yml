name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f routils_linux/requirements.txt ]; then
            python -m pip install -r routils_linux/requirements.txt
          fi

      - name: Check Windows source syntax
        run: python -m compileall -q routils_windows

      - name: Check Linux source syntax
        run: python -m compileall -q routils_linux

      - name: Run repository tests
        run: python -m pytest tests routils_linux/tests
