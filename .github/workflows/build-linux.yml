name: Build Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxkbcommon0 libegl1 libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r routils_linux/requirements.txt

      - name: Download Luau CLI
        run: python routils_linux/tools/download_luau.py --output routils_linux/bin/luau

      - name: Verify Luau CLI
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/routils_luau_smoke.luau" <<'EOF'
          local total = 0
          for _, value in ipairs({1, 2, 3, 4, 5}) do
              total += value
          end
          assert(total == 15)
          print("RoUtils Luau CLI OK")
          EOF
          routils_linux/bin/luau "$RUNNER_TEMP/routils_luau_smoke.luau" | tee "$RUNNER_TEMP/routils_luau_output.txt"
          grep -Fx "RoUtils Luau CLI OK" "$RUNNER_TEMP/routils_luau_output.txt"

      - name: Build Linux executable
        shell: bash
        run: |
          cd routils_linux
          ENTRY=""
          for file in main.py main.pyw routils.py app.py __main__.py; do
            if [ -f "$file" ]; then
              ENTRY="$file"
              break
            fi
          done
          if [ -z "$ENTRY" ]; then
            echo "Linux entry point not found"
            find . -maxdepth 2 -type f
            exit 1
          fi
          python -m PyInstaller --noconfirm --clean --onefile --name RoUtils-Linux --paths . --add-binary "bin/luau:bin" "$ENTRY"
          mkdir -p ../dist
          cp "dist/RoUtils-Linux" ../dist/RoUtils-Linux
          chmod +x ../dist/RoUtils-Linux

      - uses: actions/upload-artifact@v4
        with:
          name: RoUtils-Linux
          path: dist/RoUtils-Linux
          if-no-files-found: error
