
name: Build All

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "routils_windows/requirements.txt") {
            python -m pip install -r routils_windows/requirements.txt
          } elseif (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          Set-Location routils_windows
          if (!(Test-Path "main.pyw")) {
            throw "routils_windows/main.pyw not found"
          }
          $args = @("--noconfirm", "--clean", "--onefile", "--windowed", "--name", "RoUtils")
          if (Test-Path "routils.ico") {
            $args += @("--icon", "routils.ico")
          }
          $args += "main.pyw"
          python -m PyInstaller @args
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Copy-Item dist/RoUtils.exe ../dist/RoUtils.exe

      - uses: actions/upload-artifact@v4
        with:
          name: RoUtils-Windows
          path: dist/RoUtils.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libxkbcommon0 libegl1 libdbus-1-3 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r routils_linux/requirements.txt
          python -m pip install pyinstaller

      - name: Build Linux executable
        shell: bash
        run: |
          cd routils_linux
          ENTRY=""
          for file in main.py main.pyw routils.py app.py __main__.py; do
            if [ -f "$file" ]; then
              ENTRY="$file"
              break
            fi
          done
          if [ -z "$ENTRY" ]; then
            echo "Linux entry point not found"
            find . -maxdepth 2 -type f
            exit 1
          fi
          python -m PyInstaller --noconfirm --clean --onefile --name RoUtils-Linux --paths . "$ENTRY"
          mkdir -p ../dist
          cp dist/RoUtils-Linux ../dist/RoUtils-Linux
          chmod +x ../dist/RoUtils-Linux

      - uses: actions/upload-artifact@v4
        with:
          name: RoUtils-Linux
          path: dist/RoUtils-Linux
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoUtils-Windows
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: RoUtils-Linux
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
