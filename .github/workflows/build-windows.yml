name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "routils_windows/requirements.txt") {
            python -m pip install -r routils_windows/requirements.txt
          } elseif (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          Set-Location routils_windows
          if (!(Test-Path "main.pyw")) {
            throw "routils_windows/main.pyw not found"
          }
          $args = @("--noconfirm", "--clean", "--onefile", "--windowed", "--name", "RoUtils")
          if (Test-Path "routils.ico") {
            $args += @("--icon", "routils.ico")
          }
          $args += "main.pyw"
          python -m PyInstaller @args
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Copy-Item dist/RoUtils.exe ../dist/RoUtils.exe

      - uses: actions/upload-artifact@v4
        with:
          name: RoUtils-Windows
          path: dist/RoUtils.exe
          if-no-files-found: error
