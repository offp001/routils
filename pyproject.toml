[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"routils_linux/sober_proxy/mitm_addon.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_configs = true
files = ["routils_linux/sober_proxy/fflag_catalog.py"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist"]

[tool.routils]
license = "GPL-3.0-only"
minimum_python = "3.12"
repository = "https://github.com/offp001/routils"
